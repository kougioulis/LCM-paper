name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" pandas einops matplotlib torchmetrics "pytorch-lightning==2.0.8" pytest ruff

      - name: Ruff lint
        run: ruff check lcm_pytorch/modules lcm_pytorch/utils/utils.py tests

      - name: Run tests
        run: pytest
